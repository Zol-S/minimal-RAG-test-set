[project]
name = "rag-tester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zoltán Balogh", email = "zoltan.balogh.jr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "faiss-cpu>=1.16.0",
    "langchain-text-splitters>=1.1.3",
    "litellm>=1.110.1",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "ragas>=0.4.4",
    "ranx>=0.3.21",
    "rapidfuzz>=3.14.6",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "tqdm>=4.70.1",
]

[project.scripts]
rag-tester = "rag_tester:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
